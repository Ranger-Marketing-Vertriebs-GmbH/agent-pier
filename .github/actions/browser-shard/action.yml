name: Browser shard
description: Build the app and run one browser shard in one or more Playwright processes.
inputs:
  browser:
    description: chromium or webkit
    required: true
  shard:
    description: This shard's number, from 1
    required: true
  total:
    description: The number of shards
    required: true
  specs:
    description: >-
      This shard's own space-separated spec files; empty takes the shard's part of
      every spec, balanced by scripts/browser-shard-timings.json
    required: false
    default: ""
  processes:
    description: >-
      Parallel Playwright processes, each with its own test server port and output
      directory; the job fails when any of them fails
    required: false
    default: "1"
  repeat-timing-regressions:
    description: Also repeat the known WebKit timing regressions without retries
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24
        cache: npm
    - shell: bash
      run: npm ci
    # The runner's Ubuntu mirror has trickled Playwright's system packages at a
    # few kB/s (117 MB for WebKit, cancelled after 45 min). apt reuses every
    # cached .deb whose version the index still offers and downloads only the
    # rest. The newest set is restored; a changed set is saved right after the
    # install, whatever the specs do later.
    - name: Restore the browser system packages
      id: debs
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/browser-debs
        key: browser-debs-${{ inputs.browser }}-
        restore-keys: browser-debs-${{ inputs.browser }}-
    - name: Install the browser system packages
      shell: bash
      run: |
        set -euo pipefail
        # Playwright downloads its own browsers; the runner's Chrome APT
        # repository is unnecessary and can fail while its index is updating.
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
        debs="$HOME/.cache/browser-debs"
        mkdir -p "$debs"
        find "$debs" -maxdepth 1 -name '*.deb' -exec sudo cp -t /var/cache/apt/archives {} +
        npx playwright install-deps "$BROWSER"
        # The runner image ships tmux.
        command -v tmux > /dev/null || sudo apt-get install -y tmux
        # Keep the versions the index still offers for the cache.
        sudo apt-get autoclean
        rm -f "$debs"/*.deb
        find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t "$debs" {} +
        listing="$(ls "$debs" | sort | sha256sum | cut -c1-16)"
        echo "key=browser-debs-$BROWSER-$listing" >> "$GITHUB_OUTPUT"
      id: install-debs
      env:
        BROWSER: ${{ inputs.browser }}
    - name: Save the browser system packages
      if: steps.install-debs.outputs.key != steps.debs.outputs.cache-matched-key
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/browser-debs
        key: ${{ steps.install-debs.outputs.key }}
    - name: Restore the Playwright browser
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ inputs.browser }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install "$BROWSER"
      env:
        BROWSER: ${{ inputs.browser }}
    - shell: bash
      run: npm run build
    # scripts/browser-shards.mjs writes one argument file per process: its specs,
    # balanced by recorded seconds, or Playwright's --shard without timings. Spec
    # paths are read one per word or line into arrays, never glob-expanded. Each
    # process has its own server port (and so its own temporary data, tmux and
    # broker sockets, and login state) and output directory; with several, every
    # output line carries a "[pN] " prefix.
    - name: Run the browser specs
      shell: bash
      run: |
        set -uo pipefail
        plan="$RUNNER_TEMP/browser-shard-plan"
        read -ra specs <<< "$SPECS"
        node scripts/browser-shards.mjs --browser "$AGENTPIER_TEST_BROWSER" \
          --shard "$SHARD" --total "$TOTAL" --processes "$PROCESSES" --out "$plan" "${specs[@]}" || exit 1
        pids=()
        for file in "$plan"/process-*.args; do
          index="${file##*/process-}"
          index="${index%.args}"
          mapfile -t args < "$file"
          (
            export AGENTPIER_TEST_PORT=$((4740 + index))
            if [ "$PROCESSES" = 1 ]; then
              npx playwright test --output "test-results/process-$index" "${args[@]}"
            else
              npx playwright test --output "test-results/process-$index" "${args[@]}" 2>&1 |
                sed -u "s/^/[p$index] /"
            fi
          ) &
          pids+=("$!")
        done
        status=0
        for pid in "${pids[@]}"; do
          wait "$pid" || status=1
        done
        exit "$status"
      env:
        AGENTPIER_TEST_BROWSER: ${{ inputs.browser }}
        SHARD: ${{ inputs.shard }}
        TOTAL: ${{ inputs.total }}
        SPECS: ${{ inputs.specs }}
        PROCESSES: ${{ inputs.processes }}
    # Known WebKit timing regressions, repeated without the CI retry so one
    # failed repetition fails.
    - name: Repeat WebKit timing regressions
      if: inputs.repeat-timing-regressions == 'true'
      shell: bash
      run: >-
        npx playwright test tests/browser/model-control.spec.js tests/browser/chat-upload-recovery.spec.js
        --grep 'two tabs retry|model field.*390x500|model errors remain'
        --repeat-each=5 --retries=0
      env:
        AGENTPIER_TEST_BROWSER: ${{ inputs.browser }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: failure()
      with:
        name: browser-failure-${{ inputs.browser }}-${{ inputs.shard }}
        path: test-results/
        retention-days: 7
