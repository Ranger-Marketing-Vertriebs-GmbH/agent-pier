name: Native filesystem matrix
description: Real disk images and loop devices for the file explorer.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ">=24.22.1 <25"
        cache: npm
    - name: Install terminal test prerequisite
      shell: bash
      run: |
        if ! command -v tmux >/dev/null; then
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y tmux
          else
            brew install tmux
          fi
        fi
    - shell: bash
      run: npm ci
    - name: Install native filesystem matrix tools
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # The runner now and then cannot resolve the package mirrors for a moment
        # ("Temporary failure resolving"): try up to three times.
        for attempt in 1 2 3; do
          sudo apt-get update && sudo apt-get install -y acl attr e2fsprogs util-linux && break
          [ "$attempt" = 3 ] && exit 1
          sleep 20
        done
    # One file at a time: concurrent hdiutil create/detach calls fail with
    # "Resource busy".
    - name: Native file explorer filesystem matrix
      shell: bash
      run: >-
        node --test --test-concurrency=1
        tests/matrix/file-extract-platform.test.js
        tests/matrix/file-platform.test.js
        tests/matrix/file-recovery-boundary.test.js
      env:
        AGENTPIER_FILE_FS_MATRIX: "1"
