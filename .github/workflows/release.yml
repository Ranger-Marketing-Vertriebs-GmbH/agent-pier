name: Versioned release packages
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: agentpier-release-publication
  cancel-in-progress: false
jobs:
  # No package without a green full suite on this exact commit.
  full:
    uses: ./.github/workflows/full.yml
  installer:
    needs: full
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - run: node scripts/installer-package.mjs release-artifacts
      - run: node scripts/homebrew-formula.mjs release-artifacts
      - run: node --test tests/unit/homebrew-formula.test.js tests/integration/installer-package.test.js tests/integration/installer-online.test.js tests/integration/installer-release-publication.test.js tests/integration/homebrew-tap-update.test.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agentpier-installer
          retention-days: 7
          path: release-artifacts/*
  package:
    needs: full
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A release tag must point at a commit on main: its release.yml (with the
      # full-suite gate) and its code then passed the merge queue.
      - name: Require the tagged commit on main
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify native relocation, install and update
        run: node --test tests/integration/file-native-release.test.js
      - run: node scripts/release-package.mjs agentpier-${{ matrix.platform }}.aprelease
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agentpier-${{ matrix.platform }}
          retention-days: 7
          path: |
            agentpier-${{ matrix.platform }}.aprelease
            agentpier-${{ matrix.platform }}.aprelease.json
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [package, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A release tag must point at a commit on main: its release.yml (with the
      # full-suite gate) and its code then passed the merge queue.
      - name: Require the tagged commit on main
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agentpier-*
          path: release-artifacts
          merge-multiple: true
      - name: Create reproducible channel metadata
        run: RELEASED_AT=$(git show -s --format=%cI "$GITHUB_SHA") node scripts/release-manifest.mjs release-artifacts
      - name: Verify and publish complete tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/installer-release-publish.mjs release-artifacts
  tap:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.AGENTPIER_HOMEBREW_TAP_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentpier-installer
          path: release-artifacts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Ranger-Marketing-Vertriebs-GmbH/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Propose installer formula update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git -C homebrew-tap config user.name 'AgentPier release automation'
          git -C homebrew-tap config user.email 'agentpier-release@users.noreply.github.com'
          node scripts/homebrew-tap-update.mjs homebrew-tap release-artifacts/installer.json
