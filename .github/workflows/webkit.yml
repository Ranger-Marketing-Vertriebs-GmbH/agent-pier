name: WebKit
# Every browser spec in WebKit, plus the `tablet` project that repeats the
# assistant specs at iPad size. Advisory, never a required check: it runs nightly
# and before a release through full.yml, on demand, and on a pull request that
# carries the "webkit" label (added, or pushed to while labelled). The merge queue
# runs Chromium only.
on:
  workflow_call:
    inputs:
      repeat-timing-regressions:
        description: Also repeat the known WebKit timing regressions in shard 1
        type: boolean
        default: false
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
concurrency:
  group: webkit-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  webkit-shards:
    name: browser (webkit) shard ${{ matrix.shard }}/5
    # On a pull request only with the label; adding another label starts nothing.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'webkit') &&
      (github.event.action != 'labeled' || github.event.label.name == 'webkit'))
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    # Observed 2026-10-20..22: the specs take 17-22 min per shard (balanced
    # estimate 19.3 min, 96 min in all) and setup 1-2 min. The WebKit system
    # packages come from the browser-shard action's cache, not a slow mirror.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/browser-shard
        with:
          browser: webkit
          shard: ${{ matrix.shard }}
          total: 5
          repeat-timing-regressions: ${{ inputs.repeat-timing-regressions && matrix.shard == 1 }}
  webkit:
    name: browser (webkit)
    needs: webkit-shards
    if: ${{ !cancelled() && needs.webkit-shards.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          SHARDS: ${{ needs.webkit-shards.result }}
        run: test "$SHARDS" = success
