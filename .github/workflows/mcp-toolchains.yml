name: MCP toolchains
# Pins checked against the real downloads on every target. Pull requests run Linux.
# The same job installs PyPI packages with the real uv and CPython from a local index.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mcp-toolchains.yml"
      - "server/features/mcp-packages/toolchain*"
      - "server/features/mcp-packages/verified-files.js"
      - "server/features/mcp-packages/cpython-relocation.js"
      - "scripts/verify-mcp-toolchains.mjs"
      - "server/features/mcp-packages/python-*"
      - "server/features/mcp-packages/wheel-programs.js"
      - "server/features/mcp-packages/package-store.js"
      - "server/features/mcp-packages/package-install-job.js"
      - "server/features/mcp-packages/mcp-packages.js"
      - "tests/integration/mcp-python-packages.test.js"
      - "tests/helpers/pypi-index-fixture.js"
      - "tests/helpers/mcp-python-service.js"
  pull_request:
    paths:
      - ".github/workflows/mcp-toolchains.yml"
      - "server/features/mcp-packages/toolchain*"
      - "server/features/mcp-packages/verified-files.js"
      - "server/features/mcp-packages/cpython-relocation.js"
      - "scripts/verify-mcp-toolchains.mjs"
      - "server/features/mcp-packages/python-*"
      - "server/features/mcp-packages/wheel-programs.js"
      - "server/features/mcp-packages/package-store.js"
      - "server/features/mcp-packages/package-install-job.js"
      - "server/features/mcp-packages/mcp-packages.js"
      - "tests/integration/mcp-python-packages.test.js"
      - "tests/helpers/pypi-index-fixture.js"
      - "tests/helpers/mcp-python-service.js"
permissions:
  contents: read
concurrency:
  group: mcp-toolchains-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native:
    name: Native toolchains (${{ matrix.target }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"runner":"ubuntu-24.04","target":"linux-x64"},{"runner":"ubuntu-24.04-arm","target":"linux-arm64"}]'
          || '[{"runner":"ubuntu-24.04","target":"linux-x64"},{"runner":"ubuntu-24.04-arm","target":"linux-arm64"},{"runner":"macos-15","target":"darwin-arm64"},{"runner":"macos-15-intel","target":"darwin-x64"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/verify-mcp-toolchains.mjs "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - name: Python package installs against a local index
        env:
          AGENTPIER_MCP_PYTHON_TESTS: "1"
        run: node --test tests/integration/mcp-python-packages.test.js
