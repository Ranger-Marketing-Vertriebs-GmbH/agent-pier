name: Assistant runtime
# Nightly and before a release through full.yml: upstream registries and hosted
# runner images change without a commit. Pull requests run the Linux jobs only
# (fresh installs on x64 and arm64, native contracts on x64). The macOS jobs, the
# native contracts on Linux arm64 and macOS x64 and the cross-version updates run
# only nightly, on demand and before a release (a tag push through release.yml),
# not after each merge. The merge queue runs the core contracts through
# assistant-runtime-queue.yml.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - ".github/workflows/assistant-runtime.yml"
      - "server/features/assistants/**"
      - "server/features/assistant-channels/**"
      - "server/application/assistant-graph.js"
      - "server/features/operations/releases.js"
      - "server/lib/storage.js"
      - "scripts/*assistant*.mjs"
      - "scripts/assistant-contract-shards.json"
      - "tests/**/assistant*"
      - "tests/helpers/openclaw-dist-exports.js"
      - "tests/helpers/mcp-*"
      - "server/features/mcp-servers/**"
      - "server/http/routes/mcp-*"
      - "package.json"
      - "package-lock.json"
permissions:
  contents: read
concurrency:
  # One group per pull request (a new revision cancels the old run); every other
  # run, including each call from full.yml for a nightly or a release, gets its
  # own group, so none can cancel a pending one.
  group: assistant-runtime-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fresh-install:
    name: Fresh install (${{ matrix.target }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Native labels verified against the GitHub-hosted runners reference.
      # Existing backend CI covers host Node 22 and 24; this job always executes
      # the independently pinned managed Node/npm from the shipped installer.
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"runner":"ubuntu-24.04","target":"linux-x64"},{"runner":"ubuntu-24.04-arm","target":"linux-arm64"}]'
          || '[{"runner":"ubuntu-24.04","target":"linux-x64"},{"runner":"ubuntu-24.04-arm","target":"linux-arm64"},{"runner":"macos-15","target":"darwin-arm64"},{"runner":"macos-15-intel","target":"darwin-x64"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Verify native runner architecture
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: node --input-type=module -e 'import assert from "node:assert/strict"; assert.equal(`${process.platform}-${process.arch}`, process.env.EXPECTED_TARGET)'
      - run: npm ci
      - name: Qualify fresh shipped runtime without model credentials
        run: node scripts/verify-assistant-installation.mjs
  native-contracts:
    # The contracts run in parallel shards that scripts/assistant-contract-shards.mjs
    # balances by the measured seconds in scripts/assistant-contract-shards.json:
    # four per runner. Each shard is its own runner with its own runtime
    # installation, data directories and ports. Intel macOS (darwin-x64) is not
    # qualified here: its hosted runners are too slow and flaky for these timings.
    name: Native contracts (${{ matrix.runner }}) shard ${{ matrix.shard }}/4
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Linux x64, Linux arm64 and macOS arm64. The arm64 Linux runner only runs
        # nightly, on demand and before a release.
        runner: >-
          ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]'
          || (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
          || startsWith(github.ref, 'refs/tags/'))
          && '["ubuntu-latest","macos-latest","ubuntu-24.04-arm"]'
          || '["ubuntu-latest","macos-latest"]') }}
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report the native runner architecture
        run: node -p '`${process.platform}-${process.arch}`'
      - name: Read the pinned runtime identity
        id: runtime
        run: >-
          node --input-type=module -e 'import { runtimeManifest as m } from
          "./server/features/assistants/runtime-manifest.js";
          console.log(`identity=${m.version}-node${m.nodeVersion}-${m.dependencyLockSha256}`)'
          >> "$GITHUB_OUTPUT"
      # Only the immutable installation is cached; the data directory stays fresh.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/agentpier-assistant-contracts/assistants/runtimes
          key: assistant-runtime-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.identity }}
      - name: Provision through the installer's --with-assistants step
        run: >-
          node scripts/provision-assistant-contracts.mjs
          --data-dir "$RUNNER_TEMP/agentpier-assistant-contracts"
          --env-file "$GITHUB_ENV"
      # The compiled web tools contract drives the runner's preinstalled Google Chrome
      # headless, with its own profile in the test's temporary data directory. A
      # runner without Chrome fails here instead of skipping the browser checks.
      # When the Linux arm64 image has no Google Chrome, that runner gets
      # Playwright's Chromium instead, which has no setuid sandbox helper, so the
      # disposable runner allows unprivileged user namespaces for Chromium's own
      # sandbox. AgentPier still never compiles browser.noSandbox.
      - name: Locate the browser for the web tools contract
        run: |
          for candidate in /usr/bin/google-chrome "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"; do
            if [ -x "$candidate" ]; then
              echo "AGENTPIER_TEST_BROWSER_PATH=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          if [ "$RUNNER_OS" = Linux ] && [ "$RUNNER_ARCH" = ARM64 ]; then
            npx playwright install --with-deps chromium
            if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
            chromium=$(node -p 'require("@playwright/test").chromium.executablePath()')
            if [ -x "$chromium" ]; then
              echo "AGENTPIER_TEST_BROWSER_PATH=$chromium" >> "$GITHUB_ENV"
              exit 0
            fi
          fi
          echo "::error::No Google Chrome on this runner for the web tools contract."
          exit 1
      # The browser window contract opens a visible agent browser; a Linux runner has
      # no display, so the contract starts a private Xvfb of its own.
      - name: Provide Xvfb for the browser window contract
        if: runner.os == 'Linux'
        run: command -v Xvfb >/dev/null || { sudo apt-get update && sudo apt-get install -y xvfb; }
      # Simulated model endpoints, accounts and channels only: no secrets, so the
      # live provider test and the predecessor-runtime cross-version test skip.
      - name: Run the deterministic native contracts
        # Outside pull requests the team plugin contract holds an ask for 115 s, the
        # full wait budget of lead-requests.js; pull requests use a 12 s ask.
        env:
          AGENTPIER_TEAM_LONG_ASK: ${{ github.event_name != 'pull_request' && '1' || '' }}
        # macOS has bash 3.2 without mapfile; the contract paths contain no spaces.
        run: |
          files=$(node scripts/assistant-contract-shards.mjs \
            --shard "${{ matrix.shard }}" --total 4)
          echo "$files"
          # shellcheck disable=SC2086
          node --test --test-concurrency=1 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/native-contracts.tap" \
            $files
      - name: Fail when a contract skipped instead of running
        run: grep -qx '# skipped 0' "$RUNNER_TEMP/native-contracts.tap"
  # Installed users update from the runtime an older AgentPier release pinned
  # straight to the current pin; one entry per release line that is still a
  # rollback target. Keep `from` in step with runtimeManifest.rollbackTargets: the
  # team plugin refuses any other predecessor. Release tags are never moved.
  cross-version:
    name: Cross-version update (${{ matrix.from }}, ${{ matrix.runner }})
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest]
        # v1.27.0-v1.28.1 pinned OpenClaw 2026.9.8, v2.0.0 pinned 2026.9.9,
        # v2.1.0-v2.6.1 pinned 2026.10.3 (v2.6.x on Node 26.12.1).
        from: [v1.28.1, v2.0.0, v2.6.1]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The predecessor installs its runtime with its own manifest and lock, exactly
      # as that release's installer did; its provisioning needs no npm packages.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.from }}
          path: predecessor
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read the pinned runtime identity
        id: runtime
        run: >-
          node --input-type=module -e 'import { runtimeManifest as m } from
          "./server/features/assistants/runtime-manifest.js";
          console.log(`identity=${m.version}-node${m.nodeVersion}-${m.dependencyLockSha256}`)'
          >> "$GITHUB_OUTPUT"
      # Same path and key as native-contracts, so either job reuses the other's cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/agentpier-assistant-contracts/assistants/runtimes
          key: assistant-runtime-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.identity }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/agentpier-predecessor/assistants/runtimes
          key: assistant-predecessor-${{ runner.os }}-${{ runner.arch }}-${{ matrix.from }}
      - name: Provision the predecessor release's runtime
        working-directory: predecessor
        run: |
          : > "$RUNNER_TEMP/predecessor.env"
          node scripts/provision-assistant-contracts.mjs \
            --data-dir "$RUNNER_TEMP/agentpier-predecessor" \
            --env-file "$RUNNER_TEMP/predecessor.env"
          previous=$(sed -n 's/^AGENTPIER_ASSISTANT_UPDATE_RUNTIME=//p' "$RUNNER_TEMP/predecessor.env")
          test -x "$previous/node/bin/node"
          echo "AGENTPIER_ASSISTANT_PREVIOUS_RUNTIME=$previous" >> "$GITHUB_ENV"
      - name: Provision the pinned runtime
        run: >-
          node scripts/provision-assistant-contracts.mjs
          --data-dir "$RUNNER_TEMP/agentpier-assistant-contracts"
          --env-file "$GITHUB_ENV"
      # Activation, rollback after a failed validation, the legacy agent roster, an
      # MCP OAuth login refreshed on the updated runtime and a model key rotated
      # after the activation's Doctor run.
      - name: Run the cross-version update tests
        run: >-
          node --test --test-concurrency=1
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/cross-version.tap"
          tests/integration/assistant-runtime-cross-version.test.js
          tests/integration/assistant-mcp-oauth-cross-version.test.js
          tests/integration/assistant-doctor-credentials-cross-version.test.js
      - name: Fail when a cross-version test skipped instead of running
        run: grep -qx '# skipped 0' "$RUNNER_TEMP/cross-version.tap"
