name: Verify
# The merge queue tests the exact commit that lands on main, so a push run would
# only repeat it.
on:
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    # Observed p90 11 min (macOS); one job once hung for 2 h without a limit.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install terminal test prerequisite
        shell: bash
        run: |
          if ! command -v tmux >/dev/null; then
            if [ "$RUNNER_OS" = Linux ]; then
              sudo apt-get update
              sudo apt-get install -y tmux
            else
              brew install tmux
            fi
          fi
      - run: npm ci
      # A failed test file runs once more if the runner finished; files that pass
      # only on that retry are listed as flaky in the job summary. A file that fails
      # twice, or more than two flaky files, fail the job. Each test may take at
      # most 300 s (slowest observed without its own limit: 41 s).
      - run: npm run check
        env:
          AGENTPIER_TEST_RETRY_FAILED_FILES: "1"
          AGENTPIER_TEST_TIMEOUT_MS: "300000"
      - name: AgentBus Node and Bun compatibility
        run: >-
          npm exec --yes --package=bun@1.3.10 --
          sh -c 'bun test tests/unit/agentbus-queue.test.js && node --test tests/integration/agentbus-runtimes.test.js'
      - name: Repeated native lifecycle and copy limits
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        shell: bash
        run: |
          set -e
          for attempt in {1..10}; do
            node --test --test-name-pattern='memory access is revoked when|isolated native and POSIX|job-wide byte caps' tests/blackbox/memory-routes.test.js tests/integration/shell.test.js tests/integration/file-copy.test.js
          done
      - name: Alternate property seed
        run: npm run test:property
        env:
          FC_SEED: 173205
          FC_RUNS: 300
  # Real disk images, loop devices and the nono sandbox. Not a required check:
  # these matrices exercise host tooling that is slower and noisier than the
  # application gate. The disk image files run one at a time because concurrent
  # hdiutil create/detach calls fail with "Resource busy".
  native-matrix:
    name: native matrix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install terminal test prerequisite
        shell: bash
        run: |
          if ! command -v tmux >/dev/null; then
            if [ "$RUNNER_OS" = Linux ]; then
              sudo apt-get update
              sudo apt-get install -y tmux
            else
              brew install tmux
            fi
          fi
      - run: npm ci
      - name: Install native filesystem matrix tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y acl attr e2fsprogs util-linux
      - name: Native file explorer filesystem matrix
        run: >-
          node --test --test-concurrency=1
          tests/matrix/file-extract-platform.test.js
          tests/matrix/file-platform.test.js
          tests/matrix/file-recovery-boundary.test.js
        env:
          AGENTPIER_FILE_FS_MATRIX: "1"
      - name: Install the nono sandbox
        shell: bash
        run: |
          NONO_INSTALL_DIR="$HOME/.local/bin" sh -c "$(curl -fsSL https://nono.sh/install.sh)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nono" --version
      - name: Real nono confinement matrix
        run: node --test tests/matrix/nono-confinement.test.js
  chromium-shards:
    name: browser (chromium) shard ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    # Observed p90 12.3 min; a retry of a few slow specs fits well inside.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install browser test prerequisites
        run: |
          # Playwright downloads its own browsers; the runner's Chrome APT
          # repository is unnecessary and can fail while its index is updating.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y tmux
      - run: npm ci
      - name: Restore the Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run build
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
        env:
          AGENTPIER_TEST_BROWSER: chromium
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: browser-failure-chromium-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
  webkit-shards:
    # Playwright shards by test count, not duration: with four shards the slow
    # chat and file-explorer specs gave shard 2 a 16.5 min median. Five shards
    # cut the longest one by roughly a quarter.
    name: browser (webkit) shard ${{ matrix.shard }}/5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    # Observed p90 19.1 min with four shards.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install browser test prerequisites
        run: |
          # Playwright downloads its own browsers; the runner's Chrome APT
          # repository is unnecessary and can fail while its index is updating.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y tmux
      - run: npm ci
      - name: Restore the Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps webkit
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit
      - run: npm run build
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/5
        env:
          AGENTPIER_TEST_BROWSER: webkit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: browser-failure-webkit-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
  # Branch protection requires "browser (chromium)"; it passes only when every shard did.
  chromium:
    name: browser (chromium)
    needs: chromium-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.chromium-shards.result }}" = success
  # Branch protection requires "browser (webkit)"; it passes only when every shard did.
  webkit:
    name: browser (webkit)
    needs: webkit-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.webkit-shards.result }}" = success
