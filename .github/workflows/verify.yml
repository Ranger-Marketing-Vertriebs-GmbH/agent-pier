name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install terminal test prerequisite
        shell: bash
        run: |
          if ! command -v tmux >/dev/null; then
            if [ "$RUNNER_OS" = Linux ]; then
              sudo apt-get update
              sudo apt-get install -y tmux
            else
              brew install tmux
            fi
          fi
      - run: npm ci
      - run: npm run check
      - name: Install native filesystem matrix tools
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          sudo apt-get update
          sudo apt-get install -y acl attr e2fsprogs util-linux
      - name: Native file explorer filesystem matrix
        if: matrix.node == 24
        run: node --test tests/matrix/file-extract-platform.test.js tests/matrix/file-platform.test.js tests/matrix/file-recovery-boundary.test.js
        env:
          AGENTPIER_FILE_FS_MATRIX: "1"
      - name: AgentBus Node and Bun compatibility
        run: >-
          npm exec --yes --package=bun@1.3.10 --
          sh -c 'bun test tests/unit/agentbus-queue.test.js && node --test tests/integration/agentbus-runtimes.test.js'
      - name: Repeated native lifecycle and copy limits
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        shell: bash
        run: |
          set -e
          for attempt in {1..10}; do
            node --test --test-name-pattern='memory access is revoked when|isolated native and POSIX|job-wide byte caps' tests/blackbox/memory-routes.test.js tests/integration/shell.test.js tests/integration/file-copy.test.js
          done
      - name: Alternate property seed
        run: npm run test:property
        env:
          FC_SEED: 173205
          FC_RUNS: 300
  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install browser test prerequisites
        run: |
          # Playwright downloads its own browsers; the runner's Chrome APT
          # repository is unnecessary and can fail while its index is updating.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y tmux
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - run: npm run test:e2e
        env:
          AGENTPIER_TEST_BROWSER: ${{ matrix.browser }}
      - name: Repeat WebKit timing regressions
        if: matrix.browser == 'webkit'
        run: >-
          npx playwright test tests/browser/model-control.spec.js tests/browser/chat-upload-recovery.spec.js
          --grep 'two tabs retry|model field.*390x500|model errors remain'
          --repeat-each=5
        env:
          AGENTPIER_TEST_BROWSER: webkit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: browser-failure-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
