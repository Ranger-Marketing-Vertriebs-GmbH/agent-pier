name: Verify
# Tiered CI (AGENTPIER-60). A pull request runs the static checks plus the tests
# its change can affect (scripts/affected-tests.mjs), on Linux and Chromium; the
# merge queue runs the full node and Chromium suites under the same required job
# names, plus advisory macOS and WebKit jobs. Every Node/OS combination, the
# repeats and the extra seeds run in full.yml (nightly and before a release).
on:
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  select:
    name: select tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.plan.outputs.full }}
      mode: ${{ steps.plan.outputs.mode }}
      node-all: ${{ steps.plan.outputs.node-all }}
      node-tests: ${{ steps.plan.outputs.node-tests }}
      browser-tests: ${{ steps.plan.outputs.browser-tests }}
      browser-shards: ${{ steps.plan.outputs.browser-shards }}
      backend: ${{ steps.plan.outputs.backend }}
      filesystem-os: ${{ steps.plan.outputs.filesystem-os }}
      nono: ${{ steps.plan.outputs.nono }}
      agentbus-runtimes: ${{ steps.plan.outputs.agentbus-runtimes }}
    steps:
      # The full history, so the pull request's base commit is present; never a
      # shallow fetch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Plan the jobs
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            node scripts/affected-tests.mjs --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT"
          else
            node scripts/affected-tests.mjs --full --github-output "$GITHUB_OUTPUT"
          fi
  backend:
    name: backend (${{ matrix.os }}, ${{ matrix.node }})
    needs: select
    # Runs, and reports, even when the plan failed: a skipped required job would
    # count as passed.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.backend || '[{"os":"ubuntu-latest","node":24}]') }}
    runs-on: ${{ matrix.os }}
    # Observed p90 11 min (macOS); one job once hung for 2 h without a limit.
    timeout-minutes: 25
    env:
      # A failed test file runs once more if the runner finished; files that pass
      # only on that retry are listed as flaky in the job summary. A file that
      # fails twice, or more than two flaky files, fail the job. Each test may
      # take at most 300 s (slowest observed without its own limit: 41 s).
      AGENTPIER_TEST_RETRY_FAILED_FILES: "1"
      AGENTPIER_TEST_TIMEOUT_MS: "300000"
    steps:
      - name: Require a test plan
        env:
          SELECT: ${{ needs.select.result }}
        run: test "$SELECT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install terminal test prerequisite
        shell: bash
        run: |
          if ! command -v tmux >/dev/null; then
            if [ "$RUNNER_OS" = Linux ]; then
              sudo apt-get update
              sudo apt-get install -y tmux
            else
              brew install tmux
            fi
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:structure
      - run: npm run build
      - name: All node tests
        if: needs.select.outputs.node-all == 'true'
        run: npm test
      - name: Affected node tests
        if: needs.select.outputs.node-all != 'true' && needs.select.outputs.node-tests != ''
        env:
          TESTS: ${{ needs.select.outputs.node-tests }}
        # Word splitting of $TESTS is intended: one path per word.
        run: >-
          node scripts/test-files.mjs --label affected --concurrency 4 --retry
          --never-retry tests/property/ --test-timeout "$AGENTPIER_TEST_TIMEOUT_MS" $TESTS
      # The nono sandbox is a security boundary: the queue always runs it.
      - name: Install the nono sandbox
        if: needs.select.outputs.nono == 'true'
        shell: bash
        run: |
          NONO_INSTALL_DIR="$HOME/.local/bin" sh -c "$(curl -fsSL https://nono.sh/install.sh)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nono" --version
      - name: Real nono confinement matrix
        if: needs.select.outputs.nono == 'true'
        run: node --test tests/matrix/nono-confinement.test.js
      - name: AgentBus Node and Bun compatibility
        if: needs.select.outputs.agentbus-runtimes == 'true'
        run: >-
          npm exec --yes --package=bun@1.3.10 --
          sh -c 'bun test tests/unit/agentbus-queue.test.js && node --test tests/integration/agentbus-runtimes.test.js'
  # Real disk images and loop devices; not required. Runs on a pull request only
  # when its selection includes these files, on macOS only for platform code.
  native-filesystem-matrix:
    name: native filesystem matrix (${{ matrix.os }})
    needs: select
    if: needs.select.outputs.filesystem-os != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select.outputs.filesystem-os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/native-filesystem-matrix
  chromium-shards:
    name: browser (chromium) shard ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: select
    if: needs.select.outputs.browser-shards != '[]'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.browser-shards) }}
    runs-on: ubuntu-latest
    # Observed p90 12.3 min; a retry of a few slow specs fits well inside.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/browser-shard
        with:
          browser: chromium
          shard: ${{ matrix.shard }}
          total: ${{ strategy.job-total }}
          specs: ${{ needs.select.outputs.browser-tests }}
  # Advisory in the merge queue: WebKit runs on every merge but is not required.
  # full.yml also runs it, with the repeated timing regressions.
  webkit-shards:
    name: browser (webkit) shard ${{ matrix.shard }}/5
    needs: select
    if: needs.select.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    # Observed p90 19.1 min with four shards.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/browser-shard
        with:
          browser: webkit
          shard: ${{ matrix.shard }}
          total: 5
  # Branch protection requires "browser (chromium)". It passes when every planned
  # shard passed, or when the plan selected no spec.
  chromium:
    name: browser (chromium)
    needs: [select, chromium-shards]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          SELECT: ${{ needs.select.result }}
          SHARDS: ${{ needs.chromium-shards.result }}
          PLANNED: ${{ needs.select.outputs.browser-shards }}
        run: |
          test "$SELECT" = success
          if [ "$PLANNED" = "[]" ]; then
            echo "No browser spec is affected."
            test "$SHARDS" = skipped
          else
            test "$SHARDS" = success
          fi
  # Produced in the merge queue only; advisory, not a required check.
  webkit:
    name: browser (webkit)
    needs: [select, webkit-shards]
    if: ${{ !cancelled() && needs.select.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          SHARDS: ${{ needs.webkit-shards.result }}
        run: test "$SHARDS" = success
