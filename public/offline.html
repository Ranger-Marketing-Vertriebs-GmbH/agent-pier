<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101114" />
    <title>AgentPier — Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #101114;
        color: #f0e9e2;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 32rem;
        margin: 1.5rem;
        padding: 2rem;
        border: 1px solid #76543b;
        border-radius: 1rem;
        background: #18191c;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        color: #f49a58;
      }
      p {
        line-height: 1.6;
        color: #c1b8ad;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        color: #101114;
        background: #f49a58;
        padding: 0.8rem 1rem;
        border-radius: 0.6rem;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-icon-192.png" alt="" />
      <h1>AgentPier ist offline</h1>
      <p>
        Verbinde dieses Gerät mit dem Netzwerk und öffne AgentPier erneut. Sitzungen und
        Chats sind hier nicht offline gespeichert.
      </p>
      <a href="/">Erneut verbinden</a>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
